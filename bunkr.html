<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://bunkr.ph/css/master.css" rel="stylesheet">
    <script defer data-domain="get.bunkrr.su" data-t="v" data-v="4820fc7e-76cf-4c39-8453-b078e7bad284.mp4" src="https://bunkr.ph/js/lv.js"></script>
    <title>Download Bri Rose (40).mp4</title>
    <script>var ogname = "Bri Rose (40).mp4";</script>
</head>
<body>
    <div class="ttwp" style="min-height: 100%;">
        <div class="cont flex-1 flex items-center justify-center">
            <div class="grid auto-rows-max gap-3 py-16 w-full max-w-md">
                <span class="ic-videos w-12 h-12 rounded-full bg-main/10 text-main mx-auto ic-before grid place-content-center text-xl"></span>
                <div class="text-center">
                    <h1 class="text-2xl text-subs font-semibold">Bri Rose (40).mp4</h1>
                    <p class="mt-1 text-xs">15.46 MB</p>
                </div>
                

                <p class="mt-3 text-center">
                    <a id="download-btn" class="btn btn-main btn-lg rounded-full px-6 font-semibold ic-download-01 ic-before before:text-lg" href="#" data-id="62416685">
                        Download
                    </a>
                </p>
            </div>
        </div>
    </div>

<script>

const SIGN_SERVICE_URL = 'https://glb-apisign.cdn.cr/sign';

async function getSignedUrl(rawUrl) {
    const orig = new URL(rawUrl);
    const path = decodeURIComponent(orig.pathname);
    const r = await fetch(
        SIGN_SERVICE_URL + '?path=' + encodeURIComponent(path),
        { credentials: 'omit' }
    );
    if (!r.ok) throw new Error('sign ' + r.status);
    const { token, ex } = await r.json();
    orig.searchParams.set('token', token);
    orig.searchParams.set('ex', ex);
    return orig.toString();
}

document.addEventListener('DOMContentLoaded', () => {
    const downloadBtn = document.getElementById('download-btn');
    if (!downloadBtn) {
        console.error('Download button not found');
        return;
    }
    const id = downloadBtn.getAttribute('data-id');
    downloadBtn.addEventListener('click', (e) => {
        e.preventDefault();
        fetch('/api/_001_v2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        })
        .then(response => {
            if (!response.ok) throw new Error('Metadata fetch failed');
            return response.json();
        })
        .then(meta => {
            const rawUrl = new URL(meta.mediafiles + meta.path);
            const originalName = meta.original || (typeof ogname !== 'undefined' ? ogname : '');
            if (originalName) rawUrl.searchParams.set('n', originalName);
            return getSignedUrl(rawUrl.toString());
        })
        .then(signedUrl => {
            window.location.href = signedUrl;
        })
        .catch(error => console.error('Download error:', error));
    });
});
</script>
</body>
</html>
